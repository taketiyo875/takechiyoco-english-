            font-size: 16px;

            font-weight: bold;

            transition: all 0.2s;

            background-color: #FFA500;
            color: #ffffff;
        }

            margin: 25px 0;
        }
        .input-label {
            color: #A0522D;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
        .count-input {
            border: 2px solid #FFA500;
            border-radius: 10px;
            padding: 10px;
            font-size: 16px;
            width: 100px;
            text-align: center;
            color: #A0522D;
            font-weight: bold;
        }

            background-color: #FF7F50;
            color: #ffffff;
            border: none;
            border-radius: 15px;
            padding: 15px 40px;

<div class="container">
    <!-- ホーム画面 -->
    <div id="home-screen">

        <div class="deco-cat">🐾 🐱 🐾</div>
        
        <p class="subtitle">挑戦するレベルと問題数を指定してスタートにゃ！</p>
        
        <div class="filter-section">

    <!-- 結果画面 -->

let currentFilter = 'all';
let quizWords = [];
let currentQuestionIndex = 0;
let score = 0;
let totalQuestionsRequested = 10;
let isAnswered = false;

function setFilter(level) {
    currentFilter = level;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    event.target.classList.add('active');
}

function startQuiz() {
    const inputCount = parseInt(document.getElementById('quiz-count').value);
    if (isNaN(inputCount) || inputCount <= 0) {
        alert('正しい問題数を入力してにゃ！');
        return;
    }

    // フィルタリング
    let filtered = [];
    if (currentFilter === 'all') {
        filtered = [...wordDatabase];
    } else {
        filtered = wordDatabase.filter(w => w.level === currentFilter);
    }

    if (filtered.length === 0) {
        alert('該当する単語がありませんにゃ。');
        return;
    }

    // シャッフル
    filtered.sort(() => Math.random() - 0.5);
    
    totalQuestionsRequested = Math.min(inputCount, filtered.length);
    quizWords = filtered.slice(0, totalQuestionsRequested);
    
    currentQuestionIndex = 0;
    score = 0;
    
    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    
    showQuestion();
}

function showQuestion() {
    isAnswered = false;
    const currentWordObj = quizWords[currentQuestionIndex];
    
    // プログレス表示
    const levelJa = currentWordObj.level === 'beginner' ? '初級' : currentWordObj.level === 'intermediate' ? '中級' : '上級';
    document.getElementById('progress-display').textContent = `第 ${currentQuestionIndex + 1} 問 / ${totalQuestionsRequested} 問 [${levelJa}]`;
    
    // 単語表示（余計な文字は一切なし）
    document.getElementById('target-word').textContent = currentWordObj.word;
    
    // 選択肢の作成（誤答をデータベース全体からランダム抽出、重複なし）
    let incorrectChoices = wordDatabase
        .filter(w => w.meaning !== currentWordObj.meaning)
        .map(w => w.meaning);
    
    // ユニークな誤答を3つ選ぶ
    incorrectChoices = [...new Set(incorrectChoices)];
    incorrectChoices.sort(() => Math.random() - 0.5);
    const finalChoices = incorrectChoices.slice(0, 3);
    finalChoices.push(currentWordObj.meaning);
    finalChoices.sort(() => Math.random() - 0.5);
    
    const optionsBox = document.getElementById('options-box');
    optionsBox.innerHTML = '';
    
    finalChoices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = choice; // 綺麗な日本語のみ表示
        btn.onclick = () => selectOption(btn, choice, currentWordObj.meaning);
        optionsBox.appendChild(btn);
    });
}

function selectOption(selectedBtn, chosenMeaning, correctMeaning) {
    if (isAnswered) return;
    isAnswered = true;
    
    const buttons = document.querySelectorAll('.option-btn');
    
    if (chosenMeaning === correctMeaning) {
        selectedBtn.classList.add('correct');
        score++;
    } else {
        selectedBtn.classList.add('incorrect');
        // 正解のボタンを緑色にする
        buttons.forEach(btn => {
            if (btn.textContent === correctMeaning) {
                btn.classList.add('correct');
            }
        });
    }
    
    // 1.5秒後に次の問題、または結果画面へ
    setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < totalQuestionsRequested) {
            showQuestion();
        } else {
            showResult();
        }
    }, 1200);
}

function showResult() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('score-display').textContent = `${totalQuestionsRequested}問中 ${score}問正解！`;
}

function confirmGoHome() {
    if (confirm('データが消えるけど大丈夫かニャ？')) {
        backToHome();
    }
}

function backToHome() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('home-screen').classList.remove('hidden');
}
